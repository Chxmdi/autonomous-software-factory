spring:
  application:
    name: aegis-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${DB_USERNAME:aegis}
    password: ${DB_PASSWORD:aegis-local-only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:40}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  shutdown: graceful
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_PROBABILITY:0.1}
