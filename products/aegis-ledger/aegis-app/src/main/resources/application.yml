spring:
  application:
    name: aegis-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${DB_USERNAME:aegis}
    password: ${DB_PASSWORD:aegis-local-only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:40}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

aegis:
  projections:
    kafka-enabled: ${AEGIS_PROJECTIONS_KAFKA_ENABLED:false}
    topic: ${AEGIS_LEDGER_POSTED_TOPIC:aegis.ledger.posted}
    group-id: ${AEGIS_ACCOUNT_ACTIVITY_GROUP:aegis-account-activity-v1}

server:
  shutdown: graceful
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_PROBABILITY:0.1}
