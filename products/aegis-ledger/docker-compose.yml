services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: aegis-admin-local-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - aegis-postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-users.sql:/docker-entrypoint-initdb.d/001-users.sql:ro

  kafka:
    image: apache/kafka:4.3.1
    profiles: ["eventing"]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  redis:
    image: redis:7.4-alpine
    profiles: ["projections"]
    ports: ["6379:6379"]

volumes:
  aegis-postgres: {}
