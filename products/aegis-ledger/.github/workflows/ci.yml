name: AegisLedger CI
on:
  push:
    paths:
      - 'products/aegis-ledger/**'
  pull_request:
    paths:
      - 'products/aegis-ledger/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/aegis-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn -B verify
