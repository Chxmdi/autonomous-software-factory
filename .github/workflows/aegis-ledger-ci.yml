name: AegisLedger CI

on:
  push:
    branches:
      - product/aegis-ledger
    paths:
      - '.github/workflows/aegis-ledger-ci.yml'
      - 'products/aegis-ledger/**'
  pull_request:
    paths:
      - '.github/workflows/aegis-ledger-ci.yml'
      - 'products/aegis-ledger/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/aegis-ledger
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: products/aegis-ledger/pom.xml

      - name: Verify Maven reactor
        shell: bash
        run: |
          set +e
          mvn -B --no-transfer-progress verify > /tmp/aegis-maven.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            echo '--- Maven failure tail ---'
            tail -n 220 /tmp/aegis-maven.log || true
            echo '--- Surefire failure evidence ---'
            find . -path '*/target/surefire-reports/*.txt' -type f -print -exec tail -n 100 {} \; || true
            exit $status
          fi
          tail -n 40 /tmp/aegis-maven.log

      - name: Verify framework-free domain smoke
        run: ./scripts/verify-domain.sh

  cdc-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: products/aegis-ledger
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify PostgreSQL → Debezium → Kafka → projection
        env:
          AEGIS_CDC_CLEANUP: "true"
        run: bash ./scripts/verify-cdc.sh

      - name: Capture eventing logs on failure
        if: failure()
        run: docker compose --profile eventing logs --no-color --tail=300 || true
