name: Ojoro Web Verification
on:
  push:
    branches: [product/ojoro-platform]
  pull_request:
    paths:
      - 'apps/ojoro-web/**'
      - 'supabase/migrations/**'
      - '.github/workflows/ojoro-web.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ojoro-web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ojoro-web/package-lock.json
      - name: Install dependencies
        run: npm install --package-lock-only && npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e -- --project=chromium
