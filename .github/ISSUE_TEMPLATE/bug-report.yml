name: Defect report
description: Evidence-backed product or production defect
title: "[BUG] "
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Requirement affected
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and release impact
    validations:
      required: true
