name: AegisLedger one-time bootstrap

on:
  push:
    branches:
      - product/aegis-ledger
    paths:
      - '.github/workflows/aegis-bootstrap.yml'
      - 'products/aegis-ledger/.bootstrap/**'

permissions:
  contents: write

jobs:
  apply-workspace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AegisLedger branch
        uses: actions/checkout@v4
        with:
          ref: product/aegis-ledger
          fetch-depth: 0

      - name: Reconstruct and validate factory patch
        shell: bash
        run: |
          set -euo pipefail
          cat products/aegis-ledger/.bootstrap/aegis-patch.b64.* | base64 --decode | gzip --decompress > /tmp/aegis.patch
          git apply --check \
            --exclude=products/aegis-ledger/README.md \
            --exclude=products/aegis-ledger/docs/PROJECT_CONTEXT.md \
            /tmp/aegis.patch

      - name: Apply AegisLedger factory workspace
        shell: bash
        run: |
          set -euo pipefail
          git apply \
            --exclude=products/aegis-ledger/README.md \
            --exclude=products/aegis-ledger/docs/PROJECT_CONTEXT.md \
            /tmp/aegis.patch
          rm -rf products/aegis-ledger/.bootstrap

      - name: Commit generated workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products/aegis-ledger
          if git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
            exit 0
          fi
          git commit -m 'feat(aegis): add invariant-first ledger implementation [skip ci]'
          git push origin HEAD:product/aegis-ledger
