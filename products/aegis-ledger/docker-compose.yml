services:
  postgres:
    image: postgres:18.6-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: aegis-admin-local-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - aegis-postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-users.sql:/docker-entrypoint-initdb.d/001-users.sql:ro

  kafka:
    image: apache/kafka:4.3.1
    profiles: ["eventing"]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  app:
    build: .
    profiles: ["eventing"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/aegis
      DB_USERNAME: aegis
      DB_PASSWORD: aegis-local-only
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AEGIS_PROJECTIONS_KAFKA_ENABLED: "true"

  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    profiles: ["eventing"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: aegis-debezium-connect
      CONFIG_STORAGE_TOPIC: aegis-connect-configs
      OFFSET_STORAGE_TOPIC: aegis-connect-offsets
      STATUS_STORAGE_TOPIC: aegis-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONFIG_PROVIDERS: file
      CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
    volumes:
      - ./infrastructure/debezium/debezium.properties:/run/secrets/debezium.properties:ro

  redis:
    image: redis:7.4-alpine
    profiles: ["projections"]
    ports: ["6379:6379"]

volumes:
  aegis-postgres: {}
