name: Ojoro Web Verification
on:
  push:
    branches: [product/ojoro-platform]
  pull_request:
    paths:
      - 'apps/ojoro-web/**'
      - 'supabase/migrations/**'
      - '.github/workflows/ojoro-web.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ojoro-web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Use supported npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit dependency lock if missing
        working-directory: .
        run: |
          if ! git ls-files --error-unmatch apps/ojoro-web/package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/ojoro-web/package-lock.json
            git commit -m "chore(deps): lock Ojoro dependency graph"
            git push origin HEAD:product/ojoro-platform
          fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e -- --project=chromium
